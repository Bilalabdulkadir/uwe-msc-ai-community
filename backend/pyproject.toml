[tool.poetry]
name = "uwe-msc-ai-community-backend"
version = "0.1.0"
description = "Backend for UWE MSc AI Community Platform"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.30" }
SQLAlchemy = "^2.0.32"
asyncpg = "^0.29"
pydantic = "^2.8"
email-validator = "^2.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-jose = { extras = ["cryptography"], version = "^3.4.0" }
alembic = "^1.13.2"
python-dotenv = "^1.0"

[tool.poetry.dev-dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.23"
httpx = "^0.27"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

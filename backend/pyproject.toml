[tool.poetry]
name = "uwe-msc-ai-community-backend"
version = "0.1.0"
description = "Backend for UWE MSc AI Community"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.98"
uvicorn = {extras=["standard"], version="^0.22"}
SQLAlchemy = "^2.0"
asyncpg = "^0.27"
pydantic = "^2.4"
alembic = "^2.0"
httpx = "^0.24"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.22"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
